<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Surveillance</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="wrap">
<header><h1>AI Surveillance · People Analytics</h1><button class="ghost" onclick="toggleTheme()">◐</button></header>
<div class="grid"><div class="col">
 <div class="card"><div class="lbl">LIVE CAMERA</div><img class="live" id="img" alt="waiting for phone…"></div>
 <div class="card"><div class="lbl">OCCUPANCY TODAY (avg per hour)</div><div class="bars" id="bars"></div></div>
 <div class="card"><div class="lbl">RECENT EVENTS</div><table id="ev"></table></div></div>
<div class="col">
 <div class="card"><div class="lbl">CURRENT OCCUPANCY</div><div class="big" id="people">0</div></div>
 <div class="card"><div class="lbl">PEOPLE PASSED</div><div class="big" id="passed">0</div><p>IN <b id="in">0</b> · OUT <b id="out">0</b></p></div>
 <div class="card"><span class="dot" id="cam"></span>Camera <span id="camt">offline</span><br><span class="dot on"></span>AI online · <span id="fps">0</span> FPS</div>
 <div class="card"><div class="lbl">SETTINGS</div>
  <label>Counting line (<span id="lv">50</span>%)</label><input type="range" id="line" min="5" max="95" value="50">
  <label>Confidence (<span id="cv">40</span>%)</label><input type="range" id="conf" min="10" max="90" value="40">
  <label>High occupancy alert at <input id="max" type="number" value="10" style="width:60px"></label>
  <label><input type="checkbox" id="inv"> Swap IN / OUT</label></div>
</div></div></div>
<script src="/static/theme.js"></script>
<script>
const $=id=>document.getElementById(id);
function connect(){
  const ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws/view`);
  ws.onmessage=e=>{const d=JSON.parse(e.data);$("img").src="data:image/jpeg;base64,"+d.image;
    $("people").textContent=d.people;$("passed").textContent=d.passed;$("in").textContent=d.in;$("out").textContent=d.out;$("fps").textContent=d.fps};
  const ping=setInterval(()=>ws.readyState===1&&ws.send("ping"),20000);
  ws.onclose=()=>{clearInterval(ping);setTimeout(connect,2000)};
}
async function poll(){
  try{
    const s=await (await fetch("/api/status")).json();
    $("cam").classList.toggle("on",s.camera==="online");$("camt").textContent=s.camera;
    const st=await (await fetch("/api/stats")).json();
    const mx=Math.max(1,...st.hourly.map(h=>h[1]));
    $("bars").innerHTML=st.hourly.map(h=>`<div title="${h[0]}:00 avg ${h[1]}" style="height:${h[1]/mx*100}%"></div>`).join("");
    $("ev").innerHTML=st.events.map(e=>`<tr><td>${e[0].slice(11)}</td><td>${e[1]}</td><td>${e[2]??""}</td><td>${e[3]??""}</td></tr>`).join("");
  }catch(e){}
}
function save(){
  $("lv").textContent=$("line").value;$("cv").textContent=$("conf").value;
  fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    line_y:$("line").value/100,conf:$("conf").value/100,max_occupancy:+$("max").value,invert:$("inv").checked})});
}
["line","conf","max","inv"].forEach(i=>$(i).addEventListener("change",save));
connect();poll();setInterval(poll,3000);
</script></body></html>
